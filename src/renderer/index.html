<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: clapfile:; media-src 'self' blob: data: clapfile:; connect-src 'self' https: blob: data: clapfile:; worker-src 'self' blob: https://cdn.jsdelivr.net">
<title>Clap Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Polices proposées pour les textes (l'interface utilise les polices du système) -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Anton&family=Bangers&family=Bebas+Neue&family=Caveat:wght@700&family=Lobster&family=Montserrat:ital,wght@0,500;0,700;0,800;1,700&family=Oswald:wght@500;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@500;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body data-bg="halos">
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- Accueil -->
<section class="home view" id="home">
  <div class="home-bar"></div>
  <div class="home-card glass">
    <div class="home-head">
      <span class="logo xl" aria-hidden="true"></span>
      <div><h1>Clap <em>Studio</em></h1><p data-i="homeTag"></p></div>
    </div>
    <div class="home-grid">
      <button class="tile" id="hNew"><i data-ic="plus"></i><b data-i="hNew"></b><span data-i="hNewD"></span></button>
      <button class="tile" id="hOpen"><i data-ic="folder"></i><b data-i="hOpen"></b><span data-i="hOpenD"></span></button>
      <button class="tile" id="hVideo"><i data-ic="film"></i><b data-i="hVideo"></b><span data-i="hVideoD"></span></button>
      <button class="tile" id="hDemo"><i data-ic="wand"></i><b data-i="hDemo"></b><span data-i="hDemoD"></span></button>
    </div>
    <div class="recents" id="recents" hidden>
      <h4 data-i="recent"></h4>
      <div id="recentList"></div>
    </div>
    <div class="home-foot">
      <span class="ver" id="homeVer"></span>
      <button class="btn sm ghost" id="hSettings"><i data-ic="gear"></i><span data-i="settings"></span></button>
    </div>
  </div>
</section>

<!-- Éditeur -->
<div class="app view off" id="app">
  <header class="top glass-bar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><b>Clap</b><em>Studio</em></div>
    <button class="btn icon ghost" id="goHome" aria-label="Accueil"><i data-ic="home"></i></button>
    <div class="pwrap"><input id="pname" class="pname" aria-label="Nom du projet" maxlength="60"><span class="dirty" id="dirtyDot" hidden></span></div>
    <div class="top-actions">
      <button class="btn icon ghost" id="undo" title="Ctrl+Z" aria-label="Annuler"><i data-ic="undo"></i></button>
      <button class="btn icon ghost" id="redo" title="Ctrl+Maj+Z" aria-label="Rétablir"><i data-ic="redo"></i></button>
      <button class="btn icon ghost" id="btnSave" title="Ctrl+S" aria-label="Enregistrer"><i data-ic="save"></i></button>
      <span class="sep"></span>
      <button class="btn" id="btnImport"><i data-ic="upload"></i><span data-i="import"></span></button>
      <button class="btn" id="btnAuto"><i data-ic="wand"></i><span data-i="auto"></span></button>
      <button class="btn primary" id="btnExport"><i data-ic="download"></i><span data-i="export"></span></button>
      <button class="btn icon ghost" id="btnSettings" title="Ctrl+," aria-label="Paramètres"><i data-ic="gear"></i></button>
    </div>
  </header>

  <main class="main" id="main" data-tab="subs">
    <div class="tabs-m" role="tablist">
      <button class="tab on" data-tab="subs" data-i="tabSubs"></button>
      <button class="tab" data-tab="style" data-i="tabStyle"></button>
    </div>

    <section class="panel glass list-panel reveal" style="--d:.05s" aria-label="Éléments">
      <div class="ph-h"><h3 data-i="items"></h3><span class="count" id="count">0</span>
        <button class="btn sm" id="addBtn" data-menu="add"><i data-ic="plus"></i><span data-i="add"></span></button></div>
      <div class="sync-row">
        <span class="cl" data-i="shift"></span>
        <button class="btn sm icon ghost" id="shiftMinus" aria-label="Reculer"><i data-ic="minus"></i></button>
        <input class="num" id="shiftStep" type="number" min="0.01" max="600" step="0.05" value="0.5" aria-label="Pas du décalage (s)">
        <button class="btn sm icon ghost" id="shiftPlus" aria-label="Avancer"><i data-ic="plus"></i></button>
        <button class="btn sm ghost" id="alignFirst" data-i="alignFirst"></button>
      </div>
      <div class="scroll" id="list"></div>
    </section>

    <section class="center reveal" style="--d:.15s">
      <div class="stage-bar">
        <label for="aspect" class="hint" data-i="format"></label>
        <select id="aspect" aria-label="Format">
          <option value="orig" data-i="orig"></option>
          <option value="16/9">16:9</option>
          <option value="9/16">9:16 · TikTok</option>
          <option value="1/1">1:1</option>
          <option value="4/5">4:5</option>
        </select>
        <select id="fit" aria-label="Cadrage" hidden>
          <option value="blur" data-i="fitBlur"></option>
          <option value="fill" data-i="fitFill"></option>
          <option value="fit" data-i="fitFit"></option>
        </select>
        <span class="info" id="info"></span>
      </div>
      <div class="stage-wrap" id="stageWrap">
        <div class="stage" id="stage">
          <canvas id="demo"></canvas>
          <canvas id="bgBlur" hidden></canvas>
          <video id="vid" playsinline crossorigin="anonymous" hidden></video>
          <div class="overlay" id="overlay"></div>
          <div class="guide gv" id="gv"></div><div class="guide gh" id="gh"></div>
          <div class="drop-hint" id="dropHint"><i data-ic="film"></i><span data-i="dropHint"></span></div>
        </div>
      </div>
    </section>

    <section class="panel glass insp-panel reveal" style="--d:.25s" id="inspPanel" aria-label="Style">
      <div class="ph-h"><h3 data-i="style"></h3></div>
      <div class="scroll" id="insp"></div>
    </section>
  </main>

  <section class="tl glass reveal" style="--d:.35s" id="tl" aria-label="Timeline">
    <div class="tl-bar">
      <button class="btn sm icon ghost" id="tStart" aria-label="Début"><i data-ic="prev"></i></button>
      <button class="btn sm primary icon play" id="tPlay" aria-label="Lecture" title="Espace"><i data-ic="play"></i></button>
      <button class="btn sm icon ghost" id="tEnd" aria-label="Fin"><i data-ic="next"></i></button>
      <div class="tcode" id="tcode">00:00.00</div>
      <span class="sep"></span>
      <button class="btn sm" id="tSplit" title="S"><i data-ic="scissors"></i><span data-i="cut"></span></button>
      <button class="btn sm" id="tRemove" title="Suppr"><i data-ic="trash"></i><span data-i="removePart" id="tRemoveLbl"></span></button>
      <button class="btn sm" id="tAdd" data-menu="add"><i data-ic="plus"></i><span data-i="addAtHead"></span></button>
      <button class="btn sm on" id="tSnap" title="Magnétisme"><i data-ic="magnet"></i><span data-i="snap"></span></button>
      <div class="zoom"><span data-i="zoom"></span><input type="range" id="zoom" min="5" max="260" step="1" aria-label="Zoom"></div>
    </div>
    <div class="tl-body">
      <div class="tl-labels"><div class="tl-labels-in" id="tlLabels"></div></div>
      <div class="tl-scroll" id="tlScroll">
        <div class="tl-inner" id="tlInner">
          <div class="ruler" id="ruler"></div>
          <div class="trk v" id="trkV"></div>
          <div class="trk a" id="trkA"></div>
          <div class="lanes" id="lanes"></div>
          <div class="playhead" id="ph"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- Menu d'ajout d'éléments -->
<div class="menu glass" id="addMenu" role="menu" hidden>
  <button role="menuitem" data-add="sub"><i data-ic="cc"></i><span><b data-i="kSub"></b><small data-i="kSubD"></small></span></button>
  <button role="menuitem" data-add="text"><i data-ic="text"></i><span><b data-i="kText"></b><small data-i="kTextD"></small></span></button>
  <button role="menuitem" data-add="image"><i data-ic="image"></i><span><b data-i="kImage"></b><small data-i="kImageD"></small></span></button>
  <button role="menuitem" data-add="shape"><i data-ic="shapes"></i><span><b data-i="kShape"></b><small data-i="kShapeD"></small></span></button>
  <button role="menuitem" data-add="library"><i data-ic="sword"></i><span><b data-i="kLib"></b><small data-i="kLibD"></small></span></button>
</div>

<!-- Bibliothèque Brawlhalla -->
<div class="modal-back" id="mLib" hidden>
  <div class="modal glass wide lib" role="dialog" aria-modal="true" aria-labelledby="mLibT">
    <h2 id="mLibT" data-i="libTitle"></h2>
    <p data-i="libDesc"></p>
    <div class="seg-toggle tabs-x" id="libTabs">
      <button data-c="emotes" data-i="libEmotes"></button><button data-c="banners" data-i="libBanners"></button><button data-c="avatars" data-i="libAvatars"></button>
      <button data-c="backgrounds" data-i="libBackgrounds"></button><button data-c="images" data-i="libImages"></button><button data-c="renders" data-i="libRenders"></button>
    </div>
    <input class="lib-search" id="libQ" type="search">
    <div class="lib-grid" id="libGrid"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="libRoot" data-i="libRoot" hidden></button>
      <span class="grow"></span>
      <button class="btn ghost" id="libClose" data-i="close"></button>
    </div>
  </div>
</div>

<!-- Import -->
<div class="modal-back" id="mImp" hidden>
  <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="mImpT">
    <h2 id="mImpT" data-i="impTitle"></h2>
    <p data-i="impDesc"></p>
    <button class="drop-zone" id="impPick"><i data-ic="upload"></i><b data-i="impFiles"></b><span data-i="impFilesHint"></span></button>
    <div class="cl hint" style="margin:16px 0 6px" data-i="pasteCode"></div>
    <textarea class="code" id="impText" spellcheck="false"></textarea>
    <div class="modal-foot">
      <button class="btn ghost" id="impClose" data-i="close"></button>
      <button class="btn primary" id="impApply"><i data-ic="check"></i><span data-i="apply"></span></button>
    </div>
  </div>
</div>

<!-- Génération automatique -->
<div class="modal-back" id="mGen" hidden>
  <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="mGenT">
    <h2 id="mGenT" data-i="genTitle"></h2>
    <p data-i="genDesc"></p>
    <div class="ctl"><label for="genMode" data-i="genMode"></label>
      <select id="genMode"><option value="ai" data-i="modeAi"></option><option value="detect" data-i="modeDetect"></option></select></div>
    <div class="ctl" id="genTypeRow"><label data-i="genType"></label>
      <div class="seg-toggle" id="genType"><button data-v="speech" data-i="typeSpeech"></button><button data-v="song" data-i="typeSong"></button></div></div>
    <div class="ctl"><label for="genLang" data-i="genLang"></label><select id="genLang"></select></div>
    <div class="ctl" id="genModelRow"><label for="genModel" data-i="genModel"></label>
      <select id="genModel"><option value="onnx-community/whisper-base" data-i="mBase"></option><option value="onnx-community/whisper-small" data-i="mSmall"></option><option value="onnx-community/whisper-large-v3-turbo" data-i="mTurbo"></option></select></div>
    <div class="ctl" id="genTrackRow" hidden><label for="genTrack" data-i="genTrack"></label><select id="genTrack"></select></div>
    <div class="ctl" id="genVadRow"><label for="genVad" data-i="genVad"></label>
      <div class="rr"><input type="range" id="genVad" min="0" max="100" value="40"><output class="num" id="genVadO">40</output></div></div>
    <p class="hint" id="genVadHint" data-i="genVadHint"></p>
    <div class="ctl" id="genSensRow"><label for="genSens" data-i="genSens"></label>
      <div class="rr"><input type="range" id="genSens" min="8" max="60" value="25"><output class="num" id="genSensO">25</output></div></div>
    <div class="ctl"><label for="genRange" data-i="genRange"></label>
      <select id="genRange"><option value="all" data-i="rangeAll"></option><option value="part" data-i="rangePart"></option><option value="custom" data-i="rangeCustom"></option></select></div>
    <div class="ctl" id="genRangeRow" hidden><label data-i="rangeFromTo"></label>
      <div class="rr"><input class="num wide" id="genFrom" aria-label="Début"><span class="idx">→</span><input class="num wide" id="genTo" aria-label="Fin"></div></div>
    <label class="sw"><input type="checkbox" id="genReplace" checked><i></i><span data-i="genReplace"></span></label>
    <div class="cl hint" style="margin-bottom:6px" data-i="genScript"></div>
    <textarea id="genText" placeholder=""></textarea>
    <div class="modal-foot">
      <button class="btn ghost" id="genClose" data-i="cancel"></button>
      <button class="btn" id="genDict"><i data-ic="mic"></i><span data-i="genDict"></span></button>
      <button class="btn primary" id="genGo"><i data-ic="wand"></i><span data-i="genGo"></span></button>
    </div>
  </div>
</div>

<!-- Progression de la transcription -->
<div class="modal-back" id="mProg" hidden>
  <div class="modal glass narrow" role="dialog" aria-modal="true" aria-labelledby="mProgT">
    <h2 id="mProgT" data-i="progTitle"></h2>
    <p id="progMsg"></p>
    <div class="bar ind" id="progBar"><i id="progFill"></i></div>
    <div class="prog-sub"><span id="progPct"></span><span id="progEta"></span></div>
    <div class="modal-foot"><button class="btn ghost" id="progCancel" data-i="cancel"></button></div>
  </div>
</div>

<!-- Export -->
<div class="modal-back" id="mExp" hidden>
  <div class="modal glass wide" role="dialog" aria-modal="true" aria-labelledby="mExpT">
    <h2 id="mExpT" data-i="export"></h2>
    <div class="seg-toggle tabs-x" id="expTabs">
      <button class="on" data-f="srt">SRT</button>
      <button data-f="vtt">WebVTT</button>
      <button data-f="video" data-i="expVideo"></button>
    </div>
    <div id="expText">
      <p data-i="expDesc"></p>
      <textarea class="code" id="expOut" readonly spellcheck="false"></textarea>
    </div>
    <div id="expVid" hidden>
      <p data-i="expVideoDesc"></p>
      <div class="bar" id="expBar" hidden><i id="expFill"></i></div>
      <p class="hint" id="expStatus"></p>
      <div class="result" id="expResult" hidden></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="expClose" data-i="close"></button>
      <button class="btn" id="expCopy"><i data-ic="copy"></i><span data-i="copy"></span></button>
      <button class="btn primary" id="expSave"><i data-ic="download"></i><span data-i="save"></span></button>
      <button class="btn primary" id="expGo" hidden><i data-ic="film"></i><span data-i="expGo"></span></button>
      <button class="btn" id="expStop" hidden><span data-i="expStop"></span></button>
    </div>
  </div>
</div>

<!-- Paramètres -->
<div class="modal-back" id="mSet" hidden>
  <div class="modal glass wide settings" role="dialog" aria-modal="true" aria-labelledby="mSetT">
    <h2 id="mSetT" data-i="settings"></h2>
    <div id="setBody"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="setReset" data-i="setReset"></button>
      <span class="grow"></span>
      <button class="btn primary" id="setClose" data-i="close"></button>
    </div>
  </div>
</div>

<!-- Modifications non enregistrées -->
<div class="modal-back" id="mAsk" hidden>
  <div class="modal glass narrow" role="alertdialog" aria-modal="true" aria-labelledby="askT">
    <h2 id="askT"></h2>
    <p id="askD"></p>
    <div class="modal-foot">
      <button class="btn ghost" id="askCancel"></button>
      <button class="btn" id="askNo"></button>
      <button class="btn primary" id="askYes"></button>
    </div>
  </div>
</div>

<!-- Mise à jour -->
<div class="update glass" id="upd" hidden>
  <div class="upd-txt"><b id="updTitle"></b><span id="updMsg"></span></div>
  <div class="bar" id="updBar" hidden><i id="updFill"></i></div>
  <div class="upd-act" id="updAct" hidden>
    <button class="btn sm ghost" id="updLater" data-i="later"></button>
    <button class="btn sm primary" id="updGo" data-i="restart"></button>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="file" multiple accept="video/*,image/*,.srt,.vtt,.json,.txt,.clap" hidden>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileProj" accept=".clap,.json" hidden>
<input type="file" id="fileBg" accept="image/*" hidden>
</body>
</html>
