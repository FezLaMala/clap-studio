# Construit l'installateur Windows et le publie dans GitHub Releases quand un tag vX.Y.Z est poussé.
# L'application installée lit ces releases (latest.yml) au lancement pour se mettre à jour.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      # envoi avec gh : la publication intégrée d'electron-builder s'arrêtait avant la fin des envois
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(dist/*.exe dist/*.blockmap dist/latest.yml)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" "${files[@]}" --title "Clap Studio ${TAG#v}" --generate-notes
          fi
      # Les installations lisent les mises à jour dans un dépôt PUBLIC (celui-ci est privé : GitHub leur répond 404).
      # Secret facultatif : RELEASES_TOKEN, jeton fine-grained avec « Contents : lecture et écriture » sur ArachnoMLK/clap-studio-releases.
      # Sans lui, publier à la main : voir README (« Mises à jour automatiques »).
      - name: Publish for auto-updates (public releases repo)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ArachnoMLK/clap-studio-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::RELEASES_TOKEN absent : publier cette version à la main dans $REPO (voir README)."; exit 0; fi
          files=(dist/*.exe dist/*.blockmap dist/latest.yml)
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" -R "$REPO" --clobber
            gh release edit "$TAG" -R "$REPO" --draft=false
          else
            gh release create "$TAG" "${files[@]}" -R "$REPO" --title "Clap Studio ${TAG#v}" --notes "Mise à jour de Clap Studio ${TAG#v}."
          fi
